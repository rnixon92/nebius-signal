name: Collect and deploy

on:
  schedule:
    - cron: "17 * * * *" # hourly: spot prices, filings, site news, regions, share price
    - cron: "47 6 * * *" # daily full run: everything, incl. OpenRouter, Atlas, jobs, rate card
  workflow_dispatch:
    inputs:
      tier:
        description: "Which sources to collect"
        type: choice
        options: [all, hourly]
        default: all
  push:
    branches: [main]
    paths-ignore: ["data/**", "public/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect
        id: collect
        run: |
          if [ "${{ github.event.schedule }}" = "17 * * * *" ] || [ "${{ inputs.tier }}" = "hourly" ]; then
            echo "tier=hourly" >> "$GITHUB_OUTPUT"
            npm run collect -- --tier hourly
          else
            echo "tier=daily" >> "$GITHUB_OUTPUT"
            npm run collect
          fi
        env:
          # SEC rejects automated requests without a real contact email. Kept as a secret so it never appears in logs or the public repo.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || format('nebius-signal {0}@users.noreply.github.com', github.repository_owner) }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit new data
        run: |
          git config user.name "nebius-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet || git commit -m "data: ${{ steps.collect.outputs.tier }} collect $(date -u +'%F %H:%M') UTC"
          git pull --rebase --quiet
          git push

  deploy:
    needs: collect
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
